<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NeuroScraper Pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#10172e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="240" fill="url(#glow)"/>

  <!-- decorative node graph (audience scraping motif) -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.7">
    <line x1="980" y1="90" x2="1080" y2="150"/>
    <line x1="1080" y1="150" x2="1010" y2="240"/>
    <line x1="1080" y1="150" x2="1140" y2="100"/>
    <line x1="980" y1="90" x2="930" y2="180"/>
    <line x1="930" y1="180" x2="1010" y2="240"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="980" cy="90" r="10"/>
    <circle cx="1080" cy="150" r="14"/>
    <circle cx="1010" cy="240" r="9"/>
    <circle cx="1140" cy="100" r="7"/>
    <circle cx="930" cy="180" r="8"/>
  </g>

  <!-- accent bar -->
  <rect x="80" y="96" width="6" height="128" rx="3" fill="url(#accent)"/>

  <text x="112" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f8fafc">NeuroScraper<tspan fill="#38bdf8"> Pro</tspan></text>
  <text x="114" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Профессиональный Telegram-бот для парсинга аудитории</text>

  <!-- tech chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <g>
      <rect x="114" y="224" width="118" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
      <text x="173" y="250" fill="#e2e8f0" text-anchor="middle">Python 3.11</text>
    </g>
    <g>
      <rect x="244" y="224" width="104" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
      <text x="296" y="250" fill="#e2e8f0" text-anchor="middle">aiogram 3</text>
    </g>
    <g>
      <rect x="360" y="224" width="104" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
      <text x="412" y="250" fill="#e2e8f0" text-anchor="middle">Telethon</text>
    </g>
    <g>
      <rect x="476" y="224" width="96" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
      <text x="524" y="250" fill="#e2e8f0" text-anchor="middle">SQLite</text>
    </g>
    <g>
      <rect x="584" y="224" width="116" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
      <text x="642" y="250" fill="#e2e8f0" text-anchor="middle">asyncio</text>
    </g>
  </g>
</svg>
